[workspace]
resolver = "2"
members = [
    "crates/agentmosaic-core",
    "crates/agentmosaic-model",
    "crates/agentmosaic-tools",
    "crates/agentmosaic-workspace",
    "crates/agentmosaic-context",
    "crates/agentmosaic-storage",
    "crates/agentmosaic-runtime",
    "crates/agentmosaic-team",
    "crates/agentmosaic-tui",
    "crates/agentmosaic-cli",
]

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
sha2 = "0.10"
ignore = "0.4"
glob = "0.3"
regex = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
schemars = "0.8"
agent-client-protocol = "2.1.0"
ratatui = "0.29"
crossterm = "0.28"
