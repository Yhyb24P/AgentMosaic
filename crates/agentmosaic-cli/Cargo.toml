[package]
name = "agentmosaic-cli"
description = "AgentMosaic command-line interface for heterogeneous Agent teams"
repository = "https://github.com/Yhyb24P/AgentMosaic"
homepage = "https://am.yhshyp.xyz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dist]
dist = true

[[bin]]
name = "am"
path = "src/main.rs"

[dependencies]
agentmosaic-storage = { path = "../agentmosaic-storage" }
agentmosaic-team = { path = "../agentmosaic-team" }
agentmosaic-runtime = { path = "../agentmosaic-runtime" }
agentmosaic-tui = { path = "../agentmosaic-tui" }
clap.workspace = true
serde.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
