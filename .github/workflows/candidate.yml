name: rust-candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Published v0.3 import
        run: cargo test --locked -p agentmosaic-storage --test published_v03_import
      - name: Build copied-binary fixtures
        run: cargo build --locked --release --workspace
      - name: Copied-binary normal path
        run: scripts/ci/normal-path-smoke.sh target/release
      - name: Copied-binary recovery without replay
        run: scripts/ci/recovery-smoke.sh target/release
