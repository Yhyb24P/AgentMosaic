name: rust-quality

# Merge-tree quality gate. Credential-free and Rust-only.
# A green run here is deterministic CI hygiene, not a release qualification.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust_quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Diff hygiene
        run: git diff --check
      - name: Release hygiene
        run: |
          if git ls-files | grep -Eq '(^|/)([^/]+\.db(-wal|-shm)?|[^/]+-evidence(-check)?\.json)$'; then
            echo "runtime database or external evidence is tracked"
            exit 1
          fi
