name: rust-candidate

# Deterministic, credential-free Rust candidate qualification.
#
# Real authenticated Codex + Qwen Code E2E is NOT run here: CI has no model
# credentials. That is a local reference-profile gate, performed through the
# first-class `am init -> am agent add -> am doctor -> am run -> am status/final`
# path on a machine where `codex` and `qwen` are already authenticated.
#
# Readiness claims are separate and must never be conflated:
#   LOCAL_PRODUCT_RC_READY        local product path + real E2E; not produced by CI
#   REMOTE_DETERMINISTIC_CI_READY this workflow, green on a frozen candidate
#   PUBLIC_RELEASE_READY          false; not authorized, never produced here
#
# A green run here supports REMOTE_DETERMINISTIC_CI_READY only. It is not
# PUBLIC_RELEASE_READY, and this workflow never creates a tag or a GitHub
# Release.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to qualify (defaults to the selected branch)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clean tree
        run: test -z "$(git status --porcelain)"
      - name: Identity gate
        run: scripts/ci/check_identity.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Release build
        run: cargo build --locked --release --workspace
      - name: Diff hygiene
        run: git diff --check
      - name: Published v0.3 migration
        run: cargo test --locked -p agentmosaic-storage --test published_v03_migration
      - name: Authentic historical v8 migration
        run: cargo test --locked -p agentmosaic-storage --test schema_v8_migration
      # The release binary is copied OUT of the source tree and drives the
      # first-class path end to end: init, agent add, doctor, run, and three
      # fresh-process readbacks that must reproduce the durable state. The
      # development-only mock runtimes stand in for the external Agents; every
      # other layer (registry, board, scheduler, Lead loop, artifact hashing,
      # final grounding) is the real product. This is the normal-path gate the
      # team-runner RC is judged on.
      - name: Copied-binary normal-path smoke
        run: scripts/ci/normal-path-smoke.sh target/release
