[workspace]
resolver = "2"
members = [
    "crates/agentmosaic-storage",
    "crates/agentmosaic-runtime",
    "crates/agentmosaic-team",
    "crates/agentmosaic-tui",
    "crates/agentmosaic-cli",
]

[workspace.package]
version = "0.5.0-dev"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
agent-client-protocol = "2.1.0"
ratatui = "0.29"
crossterm = "0.28"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
