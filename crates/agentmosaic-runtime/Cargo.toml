[package]
name = "agentmosaic-runtime"
autobins = false
description = "Native Coding Agent loop: model decisions, tool dispatch, durable history"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dist]
dist = false

# These deterministic fixtures are development-only. The product bridge is a
# library entrypoint invoked by the sole public `am` binary.
[[bin]]
name = "acp_m2_mock"
path = "src/bin/acp_m2_mock.rs"

[[bin]]
name = "codex_bridge_mock"
path = "src/bin/codex_bridge_mock.rs"

[dependencies]
agentmosaic-core = { path = "../agentmosaic-core" }
agentmosaic-model = { path = "../agentmosaic-model" }
agentmosaic-tools = { path = "../agentmosaic-tools" }
agentmosaic-workspace = { path = "../agentmosaic-workspace" }
agentmosaic-context = { path = "../agentmosaic-context" }
agentmosaic-storage = { path = "../agentmosaic-storage" }
agentmosaic-team = { path = "../agentmosaic-team" }
async-trait.workspace = true
agent-client-protocol.workspace = true
sha2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true

[dev-dependencies]
agentmosaic-storage = { path = "../agentmosaic-storage" }
rusqlite.workspace = true
