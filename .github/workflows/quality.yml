name: rust-quality

# Merge-tree quality gate. Credential-free and Rust-only.
# A green run here is deterministic CI hygiene, not a release qualification.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust_quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Diff hygiene
        run: git diff --check
      - name: Release hygiene
        run: |
          # The single tracked-database exception is the frozen published-v0.3
          # SQLite compatibility fixture. It is immutable migration evidence
          # produced by the shipped 0.3.0 binary, never a runtime database, and
          # rewriting or untracking it would destroy the compatibility proof.
          # Every other database and evidence artifact is still rejected.
          if git ls-files -- . ':(exclude)crates/agentmosaic-storage/tests/fixtures/v0_3_0_state.db' \
            | grep -Eq '(^|/)([^/]+\.db(-wal|-shm)?|[^/]+-evidence(-check)?\.json)$'; then
            echo "runtime database or external evidence is tracked"
            exit 1
          fi
